<section class="test-sec reveal" id="testimonials">
  <div class="container">
    <div class="sec-label">What Clients Say</div>
    <h2 class="sec-title">Trusted by Teams That Value <span class="italic">Quality Delivery</span></h2>

    <div class="test-grid" *ngIf="items.length">
      <blockquote class="test-card glow-card tilt-card" *ngFor="let x of items">
        <div class="test-stars">
          <span *ngFor="let s of starsArr(x.rating)" class="star">★</span>
        </div>
        <p class="test-body">"{{ x.body }}"</p>
        <footer class="test-footer">
          <div class="test-avatar">{{ x.name[0] }}</div>
          <div>
            <div class="test-name">{{ x.name }}</div>
            <div class="test-meta" *ngIf="x.company || x.role">
              {{ x.role }}<span *ngIf="x.role && x.company"> · </span>{{ x.company }}
            </div>
          </div>
        </footer>
      </blockquote>
    </div>

    <div class="empty-reviews" *ngIf="!items.length">
      <p>Be the first to leave a review below.</p>
    </div>
  </div>
</section>
