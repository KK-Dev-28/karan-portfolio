<!-- experience.component.html -->
<section class="exp-sec" id="experience">
  <div class="sec-label">Journey</div>
  <h2 class="sec-title">Experience &amp;<br><span class="italic">Education</span></h2>

  <div class="timeline">
    <div class="tl-item" *ngFor="let item of items" [class.edu]="item.isEdu">
      <div class="tl-dot"></div>

      <div class="tl-body">
        <div class="tl-date">{{ item.date }}</div>
        <div class="tl-top">
          <div class="tl-role">{{ item.role }}</div>
          <span class="tl-badge" *ngIf="item.badge">{{ item.badge }}</span>
        </div>
        <div class="tl-company">
          {{ item.company }}
          <span *ngIf="item.location"> · {{ item.location }}</span>
        </div>
        <p class="tl-desc" *ngIf="item.desc">{{ item.desc }}</p>
      </div>
    </div>
  </div>
</section>
