<!-- Launcher — always available, quiet until used -->
<button class="tg-launcher" *ngIf="!open" (click)="start()" [class.pulsing]="inviting"
        aria-label="Take a guided tour of this portfolio">
  <span class="tg-avatar" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 1 3 3v1h1a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3h1V5a3 3 0 0 1 3-3z"/>
      <circle cx="9.5" cy="12.5" r="1"/><circle cx="14.5" cy="12.5" r="1"/>
    </svg>
  </span>
  <span class="tg-launcher-text">Take a tour</span>
</button>

<!-- First-visit nudge -->
<div class="tg-invite" *ngIf="inviting && !open">
  <button class="tg-invite-x" (click)="dismissInvite()" aria-label="Dismiss">✕</button>
  <p>New here? I can show you around in about a minute.</p>
  <button class="tg-invite-go" (click)="start()">Start the tour →</button>
</div>

<!-- The tour itself -->
<div class="tg-panel" *ngIf="open" role="dialog" aria-live="polite" aria-label="Portfolio tour">
  <div class="tg-head">
    <span class="tg-avatar sm" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 1 3 3v1h1a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3h1V5a3 3 0 0 1 3-3z"/>
        <circle cx="9.5" cy="12.5" r="1"/><circle cx="14.5" cy="12.5" r="1"/>
      </svg>
    </span>
    <span class="tg-count">{{ index + 1 }} / {{ steps.length }}</span>
    <button class="tg-x" (click)="finish()" aria-label="End tour">✕</button>
  </div>

  <h4 class="tg-title">{{ step.title }}</h4>
  <p class="tg-body">{{ step.body }}</p>

  <div class="tg-dots">
    <button *ngFor="let s of steps; let i = index"
            class="tg-dot" [class.on]="i === index" [class.done]="i < index"
            (click)="jump(i)" [attr.aria-label]="'Go to step ' + (i + 1)"></button>
  </div>

  <div class="tg-actions">
    <button class="tg-btn ghost" (click)="prev()" [disabled]="index === 0">Back</button>
    <button class="tg-btn primary" (click)="next()">{{ isLast ? 'Finish' : 'Next →' }}</button>
  </div>
</div>
