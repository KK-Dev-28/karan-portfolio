<!-- Scroll progress bar -->
<div id="scroll-progress" [style.width]="scrollPct + '%'"></div>

<!-- Floating pill navbar -->
<nav class="navbar" [class.scrolled]="scrolled" [class.menu-open]="menuOpen">
  <div class="navbar-pill">

    <!-- Logo -->
    <a class="logo" href="#" (click)="scrollTo('hero', $event)">
      KK<span class="logo-dot">.</span>
    </a>

    <!-- Desktop Links -->
    <ul class="nav-links">
      <li *ngFor="let l of links">
        <a [href]="'#'+l.id" (click)="scrollTo(l.id, $event)" [class.active]="activeSection === l.id">
          {{ l.label }}
        </a>
      </li>
    </ul>

    <!-- Right controls -->
    <div class="nav-controls">
      <a class="nav-blog-link" routerLink="/blog">Blog</a>

      <!-- Theme & Layout Studio Picker -->
      <div class="theme-picker">
        <button class="theme-toggle" (click)="toggleThemeMenu()" title="Customize Themes & Layouts" aria-haspopup="true" [attr.aria-expanded]="themeMenuOpen">
          <span class="theme-dot" [style.background]="currentSwatch()"></span>
          <span class="theme-btn-label">Themes</span>
        </button>

        <div class="theme-menu" *ngIf="themeMenuOpen">
          <!-- Sub-tabs -->
          <div class="picker-tabs">
            <button class="pt-btn" [class.active]="activePickerTab === 'themes'" (click)="activePickerTab = 'themes'">
              🎨 Themes ({{ themes.length }})
            </button>
            <button class="pt-btn" [class.active]="activePickerTab === 'layouts'" (click)="activePickerTab = 'layouts'">
              📐 Layouts ({{ layouts.length }})
            </button>
          </div>

          <!-- Theme options -->
          <div class="picker-list" *ngIf="activePickerTab === 'themes'">
            <button *ngFor="let t of themes" class="theme-option" [class.active]="t.id === currentTheme" (click)="pickTheme(t.id)">
              <span class="theme-swatch">
                <span [style.background]="t.swatch[0]"></span>
                <span [style.background]="t.swatch[1]"></span>
                <span [style.background]="t.swatch[2]"></span>
              </span>
              <span class="theme-option-text">
                <span class="theme-option-label">{{ t.label }}</span>
                <span class="theme-option-blurb">{{ t.blurb }}</span>
              </span>
            </button>
          </div>

          <!-- Layout options -->
          <div class="picker-list" *ngIf="activePickerTab === 'layouts'">
            <button *ngFor="let l of layouts" class="theme-option layout-option" [class.active]="l.id === currentLayout" (click)="pickLayout(l.id)">
              <span class="layout-icon">📐</span>
              <span class="theme-option-text">
                <span class="theme-option-label">{{ l.label }}</span>
                <span class="theme-option-blurb">{{ l.blurb }}</span>
              </span>
            </button>
          </div>
        </div>
      </div>

      <button *ngIf="!isLoggedIn()" class="nav-btn" (click)="openLogin()">Admin</button>
      <button *ngIf="isLoggedIn()" class="nav-btn active" (click)="goAdmin()">Dashboard</button>
    </div>

    <!-- Mobile hamburger -->
    <button class="hamburger" (click)="menuOpen = !menuOpen" [class.open]="menuOpen">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- Mobile menu -->
<div class="mobile-menu" [class.open]="menuOpen">
  <ul>
    <li *ngFor="let l of links">
      <a [href]="'#'+l.id" (click)="scrollTo(l.id, $event); menuOpen=false">{{ l.label }}</a>
    </li>
    <li><a routerLink="/blog" (click)="menuOpen=false">Blog</a></li>
    <li><a href="/insights" (click)="menuOpen=false">Visitor Logs</a></li>
  </ul>
  <div class="mobile-footer">
    <div class="mobile-theme-row">
      <button *ngFor="let t of themes" class="mobile-theme-dot" [class.active]="t.id === currentTheme"
              [style.background]="t.swatch[2]" [title]="t.label" (click)="pickTheme(t.id)"></button>
    </div>
    <button *ngIf="!isLoggedIn()" class="nav-btn" (click)="openLogin(); menuOpen=false">Admin Login</button>
    <button *ngIf="isLoggedIn()" class="nav-btn active" (click)="goAdmin()">Dashboard</button>
  </div>
</div>
<div class="menu-overlay" *ngIf="menuOpen" (click)="menuOpen=false"></div>
<div class="theme-menu-overlay" *ngIf="themeMenuOpen" (click)="themeMenuOpen=false"></div>

<!-- Login Modal -->
<div class="overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-hdr">
      <span class="modal-title">Admin Login</span>
      <button class="modal-x" (click)="closeModal()">✕</button>
    </div>
    <p class="modal-sub">Enter your admin password to access the dashboard.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••••" [class.err]="loginError" />
        <div class="err-msg" *ngIf="loginError">{{ loginError }}</div>
      </div>
      <button type="submit" class="login-btn" [disabled]="loginLoading">
        {{ loginLoading ? 'Signing in…' : 'Sign In →' }}
      </button>
    </form>
  </div>
</div>
