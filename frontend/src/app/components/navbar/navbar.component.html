<!-- Scroll progress bar -->
<div id="scroll-progress" [style.width]="scrollPct + '%'"></div>

<!-- Floating pill navbar -->
<nav class="navbar" [class.scrolled]="scrolled" [class.menu-open]="menuOpen">
  <div class="navbar-pill">

    <!-- Logo -->
    <a class="logo" href="#" (click)="scrollTo('hero', $event)">
      KK<span class="logo-dot">.</span>
    </a>

    <!-- Desktop Links -->
    <ul class="nav-links">
      <li *ngFor="let l of links">
        <a [href]="'#'+l.id" (click)="scrollTo(l.id, $event)" [class.active]="activeSection === l.id">
          {{ l.label }}
        </a>
      </li>
    </ul>

    <!-- Right controls -->
    <div class="nav-controls">
      <a class="nav-blog-link" routerLink="/blog">Blog</a>
      <button class="theme-toggle" (click)="toggleTheme()" [title]="theme === 'dark' ? 'Switch to light' : 'Switch to dark'">
        <!-- Sun icon (dark mode → click for light) -->
        <svg *ngIf="theme === 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <!-- Moon icon (light mode → click for dark) -->
        <svg *ngIf="theme !== 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>
      <button *ngIf="!isLoggedIn()" class="nav-btn" (click)="openLogin()">Admin</button>
      <button *ngIf="isLoggedIn()" class="nav-btn active" (click)="goAdmin()">Dashboard</button>
    </div>

    <!-- Mobile hamburger -->
    <button class="hamburger" (click)="menuOpen = !menuOpen" [class.open]="menuOpen">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- Mobile menu -->
<div class="mobile-menu" [class.open]="menuOpen">
  <ul>
    <li *ngFor="let l of links">
      <a [href]="'#'+l.id" (click)="scrollTo(l.id, $event); menuOpen=false">{{ l.label }}</a>
    </li>
    <li><a routerLink="/blog" (click)="menuOpen=false">Blog</a></li>
    <li><a href="/insights" (click)="menuOpen=false">Visitor Logs</a></li>
  </ul>
  <div class="mobile-footer">
    <button class="theme-toggle" (click)="toggleTheme()">
      <svg *ngIf="theme === 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
      <svg *ngIf="theme !== 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      {{ theme === 'dark' ? 'Light Mode' : 'Dark Mode' }}
    </button>
    <button *ngIf="!isLoggedIn()" class="nav-btn" (click)="openLogin(); menuOpen=false">Admin Login</button>
    <button *ngIf="isLoggedIn()" class="nav-btn active" (click)="goAdmin()">Dashboard</button>
  </div>
</div>
<div class="menu-overlay" *ngIf="menuOpen" (click)="menuOpen=false"></div>

<!-- Login Modal -->
<div class="overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-hdr">
      <span class="modal-title">Admin Login</span>
      <button class="modal-x" (click)="closeModal()">✕</button>
    </div>
    <p class="modal-sub">Enter your admin password to access the dashboard.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••••" [class.err]="loginError" />
        <div class="err-msg" *ngIf="loginError">{{ loginError }}</div>
      </div>
      <button type="submit" class="login-btn" [disabled]="loginLoading">
        {{ loginLoading ? 'Signing in…' : 'Sign In →' }}
      </button>
    </form>
  </div>
</div>
