<div class="terminal-overlay" *ngIf="isOpen" (click)="close()" role="dialog" aria-modal="true" aria-label="Developer Terminal">
  <div class="terminal-window" (click)="$event.stopPropagation()">

    <!-- Terminal Window Bar -->
    <div class="terminal-titlebar">
      <div class="window-controls">
        <button class="win-btn close" (click)="close()" title="Close Terminal"></button>
        <button class="win-btn minimize" (click)="close()" title="Minimize"></button>
        <button class="win-btn zoom" title="Maximize"></button>
      </div>
      <div class="window-title">
        <span class="term-icon">⚡</span>
        <span>karan&#64;macbook-pro: ~/portfolio (zsh)</span>
      </div>
      <div class="win-status">ONLINE // 60 FPS</div>
    </div>

    <!-- Terminal Content Area -->
    <div class="terminal-body" #terminalBody (click)="cmdInput?.focus()">
      <div *ngFor="let l of lines" class="term-line" [ngClass]="'line-' + l.type">
        {{ l.text }}
      </div>

      <!-- Current Command Prompt Line -->
      <form class="prompt-line" (ngSubmit)="submitCommand()">
        <span class="prompt-user">karan&#64;dev:~$</span>
        <input #cmdInput type="text" [(ngModel)]="currentInput" name="currentInput"
               autocomplete="off" spellcheck="false" autofocus />
      </form>
    </div>

  </div>
</div>
