<section class="hero" id="hero">
  <canvas #canvas class="hero-canvas"></canvas>

  <!-- Aurora blobs -->
  <div class="aurora-blob blob-1"></div>
  <div class="aurora-blob blob-2"></div>
  <div class="aurora-blob blob-3"></div>

  <div class="hero-overlay">
    <div class="hero-badge" *ngIf="hero?.available">
      <span class="badge-dot"></span>
      {{ hero?.badge }}
    </div>

    <h1 class="hero-name" *ngIf="hero">
      <span class="line1">
        <span class="letter" *ngFor="let l of nameLetters; let i = index"
              [style.animation-delay]="(i * 0.06) + 's'">{{ l }}</span>
      </span>
      <span class="line2">
        <span class="letter letter-outline" *ngFor="let l of lastLetters; let i = index"
              [style.animation-delay]="(0.4 + i * 0.06) + 's'">{{ l }}</span><em class="dot-accent">.</em>
      </span>
    </h1>

    <div class="hero-role" *ngIf="hero">
      <span class="role-title">{{ hero.role }}</span>
      <span class="role-sep">·</span>
      <span class="role-stack">{{ hero.stack }}</span>
    </div>

    <p class="hero-desc" *ngIf="hero">{{ hero.description }}</p>

    <div class="hero-cta" *ngIf="hero">
      <button class="btn-primary" (click)="go('projects')">
        <span>{{ hero.ctaPrimary }}</span>
        <span class="btn-arrow">→</span>
      </button>
      <a class="btn-wa" [href]="waUrl" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        WhatsApp Me
      </a>
      <button class="btn-ghost" (click)="go('contact')">{{ hero.ctaGhost }}</button>

      <!-- Only rendered once a video URL is set in Admin → CMS → hero -->
      <button class="btn-tour" *ngIf="hero.tourVideoUrl" (click)="openTour()">
        <span class="tour-play" aria-hidden="true">▶</span>
        {{ hero.tourCta || 'Watch the tour' }}
      </button>
    </div>
  </div>

  <div class="hero-stats" *ngIf="hero">
    <div class="stat">
      <div class="stat-n">{{ hero.yearsExp }}<span>+</span></div>
      <div class="stat-l">Years Exp</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-n">{{ hero.liveApps }}<span>+</span></div>
      <div class="stat-l">Live Apps</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-n">100<span>%</span></div>
      <div class="stat-l">Client Satisfaction</div>
    </div>
  </div>

  <div class="scroll-hint">
    <div class="scroll-line"></div>
    <span>scroll</span>
  </div>

  <!-- Walkthrough video. The iframe only exists while open, so it costs
       nothing on page load and its audio stops the moment it closes. -->
  <div class="tour-overlay" *ngIf="tourOpen" (click)="closeTour()">
    <div class="tour-modal" (click)="$event.stopPropagation()">
      <button class="tour-close" (click)="closeTour()" aria-label="Close video">✕</button>
      <div class="tour-frame">
        <iframe
          [src]="tourUrl"
          title="Portfolio walkthrough"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
    </div>
  </div>
</section>
