<section class="hero" id="hero">
  <canvas #canvas class="hero-canvas"></canvas>

  <div class="hero-overlay">
    <div class="hero-badge" *ngIf="hero?.available">
      <span class="badge-dot"></span>
      {{ hero?.badge }}
    </div>

    <h1 class="hero-name" *ngIf="hero">
      <span class="line1">{{ hero.name }}</span>
      <span class="line2">{{ hero.lastName }}<em class="dot-accent">.</em></span>
    </h1>

    <div class="hero-role" *ngIf="hero">
      <span>{{ hero.role }}</span>
      <span class="role-sep">·</span>
      <span class="role-stack">{{ hero.stack }}</span>
    </div>

    <p class="hero-desc" *ngIf="hero">{{ hero.description }}</p>

    <div class="hero-cta" *ngIf="hero">
      <button class="btn-primary" (click)="go('projects')" data-cursor="VIEW">
        {{ hero.ctaPrimary }}
        <span class="btn-arrow">→</span>
      </button>
      <a class="btn-wa" [href]="waUrl" target="_blank" data-cursor="CHAT">
        <span class="wa-icon">💬</span> WhatsApp Me
      </a>
      <button class="btn-ghost" (click)="go('contact')" data-cursor="OPEN">
        {{ hero.ctaGhost }}
      </button>
    </div>
  </div>

  <div class="hero-stats" *ngIf="hero">
    <div class="stat">
      <div class="stat-n">{{ hero.yearsExp }}<span>+</span></div>
      <div class="stat-l">Years Exp</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-n">{{ hero.liveApps }}<span>+</span></div>
      <div class="stat-l">Live Apps</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-n">100<span>%</span></div>
      <div class="stat-l">Client Satisfaction</div>
    </div>
  </div>

  <div class="scroll-hint">
    <div class="scroll-line"></div>
    <span>scroll</span>
  </div>
</section>
