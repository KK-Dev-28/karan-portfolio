services:
  - type: web
    name: karan-portfolio-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_SYNC
        value: "true"
      - key: FRONTEND_URL
        value: "https://karan-portfolio-six-sigma.vercel.app"
      # The TaskFlow demo is served from its own domain and calls this API, so
      # its origin has to be allowed or the browser blocks every request.
      - key: ADDITIONAL_CORS_ORIGINS
        value: "https://taskflow-karan.vercel.app"
