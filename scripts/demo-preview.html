<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio Demos — Local Preview</title>
<style>
  :root{
    --bg:#0b0f19; --panel:#131a2a; --panel2:#1a2236; --line:#26304a;
    --ink:#e8edf7; --muted:#93a0bd; --gold:#e8b64c; --ok:#39d98a; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,Segoe UI,Roboto,sans-serif}
  header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  h1{font-size:19px;margin:0;font-weight:650}
  .pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .pill.live{color:var(--ok);border-color:#1d4d38}
  .pill.down{color:var(--bad);border-color:#5c2626}
  nav{display:flex;gap:8px;padding:16px 28px 0}
  nav button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:9px 18px;border-radius:9px;cursor:pointer;font-size:14px}
  nav button.on{background:var(--gold);color:#20180a;border-color:var(--gold);font-weight:600}
  main{padding:20px 28px 60px;max-width:1180px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 6px;font-size:15px}
  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  button.act{background:var(--gold);color:#20180a;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  .price{color:var(--gold);font-weight:650}
  .tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px}
  .bar > i{display:block;height:100%;background:var(--gold)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
  .topic{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .topic:last-child{border-bottom:0}
  .dot{width:17px;height:17px;border-radius:5px;border:1px solid var(--line);flex:0 0 auto;margin-top:2px;display:grid;place-items:center;font-size:11px}
  .dot.done{background:var(--ok);border-color:var(--ok);color:#0b2a1c}
  .err{background:#3a1c1c;border:1px solid #5c2626;color:#ffb4b4;padding:10px 13px;border-radius:9px;margin-bottom:14px}
  .sec{margin:26px 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Portfolio Demos — Local Preview</h1>
  <span class="pill" id="api"></span>
  <span class="pill" id="sid"></span>
</header>
<nav>
  <button id="tabShop" class="on" onclick="show('shop')">E-Commerce</button>
  <button id="tabLms" onclick="show('lms')">Learning Platform</button>
</nav>
<main>
  <div id="err"></div>
  <div id="shop"></div>
  <div id="lms" hidden></div>
</main>

<script>
const API = 'http://localhost:3111/api';
// Persisted so a reload keeps the same cart and course progress.
const SID = localStorage.getItem('demoSid') || (() => {
  const s = 'preview-' + Math.random().toString(36).slice(2, 12);
  localStorage.setItem('demoSid', s); return s;
})();
document.getElementById('sid').textContent = 'session ' + SID.slice(-6);

const $ = id => document.getElementById(id);
const money = p => '₹' + (p / 100).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, opts) {
  const res = await fetch(API + path, {
    headers: {'Content-Type': 'application/json'}, ...opts,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.message || ('HTTP ' + res.status));
  return body;
}
const fail = e => { $('err').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; };
const clearErr = () => { $('err').innerHTML = ''; };

function show(which) {
  $('shop').hidden = which !== 'shop';
  $('lms').hidden = which !== 'lms';
  $('tabShop').className = which === 'shop' ? 'on' : '';
  $('tabLms').className = which === 'lms' ? 'on' : '';
  clearErr();
  which === 'shop' ? renderShop() : renderLms();
}

// ── E-commerce ─────────────────────────────────────────────────────────────
let activeCat = 'all';

async function renderShop() {
  try {
    const [cats, products, cart, orders] = await Promise.all([
      api('/shop/categories'),
      api('/shop/products' + (activeCat === 'all' ? '' : '?category=' + activeCat)),
      api('/shop/cart?sessionId=' + SID),
      api('/shop/orders?sessionId=' + SID),
    ]);

    const chips = ['all', ...cats.map(c => c.slug)].map(s =>
      `<button class="${s === activeCat ? 'act' : 'ghost'}" onclick="setCat('${s}')">${esc(s === 'all' ? 'All' : cats.find(c => c.slug === s).name)}</button>`
    ).join(' ');

    const cards = products.map(p => `
      <div class="card">
        <div style="font-size:30px">${p.imageEmoji || '📦'}</div>
        <h3>${esc(p.name)}</h3>
        <div class="muted" style="min-height:38px">${esc(p.description)}</div>
        <div class="row" style="margin-top:10px">
          <span class="price">${esc(p.priceLabel)}</span>
          <span class="tag">${p.inStock ? p.stock + ' in stock' : 'out of stock'}</span>
        </div>
        <div style="margin-top:10px">
          <button class="act" ${p.inStock ? '' : 'disabled style="opacity:.4;cursor:not-allowed"'}
            onclick="addCart('${p.id}')">Add to cart</button>
        </div>
      </div>`).join('');

    const cartRows = cart.items.length ? cart.items.map(l => `
      <tr>
        <td>${l.product.imageEmoji} ${esc(l.product.name)}</td>
        <td>${money(l.product.pricePaise)}</td>
        <td>
          <button class="ghost" onclick="setQty('${l.productId}',${l.quantity - 1})">−</button>
          <b style="padding:0 9px">${l.quantity}</b>
          <button class="ghost" onclick="setQty('${l.productId}',${l.quantity + 1})">+</button>
        </td>
        <td><b>${money(l.lineTotalPaise)}</b></td>
      </tr>`).join('') : '<tr><td colspan="4" class="muted">Cart is empty.</td></tr>';

    const orderRows = orders.length ? orders.map(o => `
      <tr>
        <td><code>${esc(o.reference)}</code></td>
        <td>${o.itemCount}</td>
        <td>${esc(o.totalLabel)}</td>
        <td><span class="tag">${esc(o.status)}</span></td>
        <td>${['pending','approved'].includes(o.status)
          ? `<button class="ghost" onclick="advance('${o.reference}')">advance →</button>` : '—'}</td>
      </tr>`).join('') : '<tr><td colspan="5" class="muted">No orders yet.</td></tr>';

    $('shop').innerHTML = `
      <div style="display:flex;gap:8px;flex-wrap:wrap">${chips}</div>
      <div class="sec">Catalogue</div>
      <div class="grid">${cards}</div>
      <div class="sec">Cart — ${cart.count} item(s), ${money(cart.totalPaise)}</div>
      <div class="card">
        <table><thead><tr><th>Product</th><th>Unit</th><th>Qty</th><th>Line</th></tr></thead>
        <tbody>${cartRows}</tbody></table>
        ${cart.items.length ? `<div style="margin-top:13px"><button class="act" onclick="checkout()">Checkout ${money(cart.totalPaise)}</button></div>` : ''}
      </div>
      <div class="sec">Orders</div>
      <div class="card">
        <table><thead><tr><th>Reference</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody>${orderRows}</tbody></table>
      </div>`;
    clearErr();
  } catch (e) { fail(e); }
}

const setCat   = c => { activeCat = c; renderShop(); };
const addCart  = async id => { try { await api('/shop/cart', {method:'POST', body: JSON.stringify({productId:id, sessionId:SID, quantity:1})}); renderShop(); } catch(e){fail(e);} };
const setQty   = async (id,q) => { if(q<0) return; try { await api('/shop/cart/'+id, {method:'PUT', body: JSON.stringify({sessionId:SID, quantity:q})}); renderShop(); } catch(e){fail(e);} };
const checkout = async () => { try { const o = await api('/shop/checkout', {method:'POST', body: JSON.stringify({sessionId:SID, customerName:'Preview User'})}); await renderShop(); $('err').innerHTML = `<div class="err" style="background:#12301f;border-color:#1d4d38;color:#8ff0bd">Order ${esc(o.reference)} placed — ${esc(o.totalLabel)}</div>`; } catch(e){fail(e);} };
const advance  = async ref => { try { await api('/shop/orders/'+ref+'/advance', {method:'POST'}); renderShop(); } catch(e){fail(e);} };

// ── Learning platform ──────────────────────────────────────────────────────
let openSlug = null;

async function renderLms() {
  try {
    const courses = await api('/lms/courses');
    const detail = openSlug ? await api('/lms/courses/' + openSlug + '?sessionId=' + SID) : null;

    const cards = courses.map(c => `
      <div class="card">
        <div class="row"><span class="tag">${esc(c.level)}</span><span class="tag">${esc(c.category)}</span></div>
        <h3 style="margin-top:9px">${esc(c.title)}</h3>
        <div class="muted" style="min-height:56px">${esc(c.summary)}</div>
        <div class="muted" style="margin-top:8px">${c.chapterCount} chapters · ${c.topicCount} topics · ${c.durationMinutes} min</div>
        <div style="margin-top:11px;display:flex;gap:8px">
          <button class="act" onclick="openCourse('${c.slug}')">Open</button>
          <button class="ghost" onclick="enroll('${c.id}')">Enrol</button>
        </div>
      </div>`).join('');

    let detailHtml = '';
    if (detail) {
      const pct = detail.totalTopics ? Math.round(detail.completedCount / detail.totalTopics * 100) : 0;
      detailHtml = `
        <div class="sec">${esc(detail.title)} — ${detail.completedCount}/${detail.totalTopics} complete (${pct}%)</div>
        <div class="card">
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="muted" style="margin:9px 0 4px">${detail.enrolled ? 'Enrolled' : 'Not enrolled — ticking a topic enrols you'} · ${esc(detail.instructor)}</div>
          ${detail.chapters.map(ch => `
            <div style="margin-top:15px">
              <b>${esc(ch.title)}</b>
              ${ch.topics.map(t => `
                <div class="topic" onclick="toggle('${t.id}')">
                  <span class="dot ${t.completed ? 'done' : ''}">${t.completed ? '✓' : ''}</span>
                  <span>
                    <div>${esc(t.title)} <span class="muted">· ${t.minutes} min</span></div>
                    <div class="muted">${esc(t.body)}</div>
                  </span>
                </div>`).join('')}
            </div>`).join('')}
          <div style="margin-top:14px"><button class="ghost" onclick="closeCourse()">Close</button></div>
        </div>`;
    }

    $('lms').innerHTML = `<div class="sec">Courses</div><div class="grid">${cards}</div>${detailHtml}`;
    clearErr();
  } catch (e) { fail(e); }
}

const openCourse  = s => { openSlug = s; renderLms(); };
const closeCourse = () => { openSlug = null; renderLms(); };
const enroll = async id => { try { const r = await api('/lms/enrollments', {method:'POST', body: JSON.stringify({courseId:id, sessionId:SID})}); $('err').innerHTML = `<div class="err" style="background:#12301f;border-color:#1d4d38;color:#8ff0bd">${r.alreadyEnrolled ? 'Already enrolled' : 'Enrolled'}</div>`; } catch(e){fail(e);} };
const toggle = async id => { try { await api('/lms/progress', {method:'POST', body: JSON.stringify({topicId:id, sessionId:SID})}); renderLms(); } catch(e){fail(e);} };

// ── boot ───────────────────────────────────────────────────────────────────
(async () => {
  try {
    await api('/health');
    $('api').textContent = 'API up · localhost:3111';
    $('api').className = 'pill live';
    renderShop();
  } catch {
    $('api').textContent = 'API down — start the backend';
    $('api').className = 'pill down';
    fail(new Error('Cannot reach ' + API + '. Start the backend, then reload this page.'));
  }
})();
</script>
</body>
</html>
